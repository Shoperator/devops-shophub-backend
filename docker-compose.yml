services:
  postgres:
    image: postgres:17-alpine
    container_name: shophub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shophub
      POSTGRES_PASSWORD: shophub
      POSTGRES_DB: shophub
    ports:
      - "5432:5432"
    volumes:
      - shophub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shophub -d shophub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shophub-postgres-data:
